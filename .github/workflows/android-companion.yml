name: Android companion

on:
  push:
    branches:
      - codex/android-companion
    paths:
      - 'android/**'
      - '.github/workflows/android-companion.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-companion.yml'
  workflow_dispatch:
    inputs:
      build_signed_release:
        description: 'Build an owner-signed APK artifact (does not publish a Release)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 37 platform
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Run JVM tests and build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: vrcx-mirai-companion-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  signed-release:
    if: github.event_name == 'workflow_dispatch' && inputs.build_signed_release
    runs-on: ubuntu-latest
    env:
      VRCX_ANDROID_KEYSTORE_BASE64: ${{ secrets.VRCX_ANDROID_KEYSTORE_BASE64 }}
      VRCX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VRCX_ANDROID_KEYSTORE_PASSWORD }}
      VRCX_ANDROID_KEY_ALIAS: ${{ secrets.VRCX_ANDROID_KEY_ALIAS }}
      VRCX_ANDROID_KEY_PASSWORD: ${{ secrets.VRCX_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 37 platform
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Restore owner keystore
        shell: bash
        run: |
          test -n "$VRCX_ANDROID_KEYSTORE_BASE64"
          test -n "$VRCX_ANDROID_KEYSTORE_PASSWORD"
          test -n "$VRCX_ANDROID_KEY_ALIAS"
          test -n "$VRCX_ANDROID_KEY_PASSWORD"
          umask 077
          printf '%s' "$VRCX_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/owner.jks"
          echo "VRCX_ANDROID_KEYSTORE=$RUNNER_TEMP/owner.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            android/app/build/outputs/apk/release/app-release.apk
      - name: Upload signed APK for review
        uses: actions/upload-artifact@v7
        with:
          name: vrcx-mirai-companion-signed-review
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
